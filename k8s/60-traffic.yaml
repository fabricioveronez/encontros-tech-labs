# Gerador de trafego do encontros-tech.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encontros-tech-traffic
  namespace: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech-traffic
    app.kubernetes.io/part-of: encontros-tech
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: encontros-tech-traffic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: encontros-tech-traffic
        app.kubernetes.io/part-of: encontros-tech
    spec:
      containers:
        - name: traffic
          image: curlimages/curl:8.11.1
          # command, nao args: a imagem tem ENTRYPOINT ["curl"].
          command:
            - sh
            - -c
            # Sem $( ): o Kubernetes expande $(VAR) em command/args antes do
            # shell ver. O -w do curl ja imprime o status.
            - |
              BASE=http://encontros-tech.encontros-tech.svc.cluster.local
              while true; do
                for p in / /api/events/ /health /ready; do
                  curl -s -o /dev/null -m 5 \
                    -w "traffic path=$p status=%{http_code} time=%{time_total}s\n" \
                    "$BASE$p" || echo "traffic path=$p status=000"
                done
                sleep 1
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
