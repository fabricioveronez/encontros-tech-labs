# Seed do encontros-tech.
#
# O repositorio nao tem migration nem seed automatizado: o schema nasce de
# Base.metadata.create_all() no import do main.py, e a carga inicial e manual,
# pelo api-requests.http (feito para o REST Client do editor). Este Job faz as
# mesmas chamadas de dentro do cluster.
#
# A API nao aceita bulk — e um POST por evento, dai o script em Python em vez
# de um curl unico. O script verifica antes de escrever, entao reexecutar e
# seguro; e o nome do Job carrega o short SHA porque spec.template de um Job e
# IMUTAVEL, e um Job de nome fixo cujo script mudou faz o `kubectl apply`
# falhar com "field is immutable".
apiVersion: v1
kind: ConfigMap
metadata:
  name: encontros-tech-seed
  namespace: encontros-tech
  labels:
    app.kubernetes.io/part-of: encontros-tech
data:
  seed.py: |
    """Carga inicial de eventos. Aguarda a app ficar pronta e posta um a um."""
    import json
    import time
    import urllib.error
    import urllib.request

    BASE = "http://encontros-tech.encontros-tech.svc.cluster.local"

    def alive() -> bool:
        try:
            with urllib.request.urlopen(f"{BASE}/ready", timeout=5) as r:
                return r.status == 200
        except Exception:
            return False

    for tentativa in range(60):
        if alive():
            break
        print(f"aguardando encontros-tech ficar ready ({tentativa + 1})", flush=True)
        time.sleep(3)
    else:
        raise SystemExit("encontros-tech nao ficou ready a tempo")

    # Guarda de idempotencia. O Job nao e naturalmente idempotente — a API nao
    # verifica duplicata — e uma unica requisicao que estoure o timeout faz o
    # Kubernetes reexecutar o pod inteiro, duplicando tudo que ja tinha
    # entrado. Consultar antes de escrever e o que torna a reexecucao segura.
    def ja_populado() -> bool:
        try:
            with urllib.request.urlopen(f"{BASE}/api/events/?limit=1", timeout=10) as r:
                return len(json.load(r)) > 0
        except Exception:
            return False

    if ja_populado():
        print("banco ja populado, nada a fazer", flush=True)
        raise SystemExit(0)

    eventos = json.load(open("/seed/eventos.json", encoding="utf-8"))
    criados = 0
    recusados = 0
    for evento in eventos:
        payload = json.dumps(evento).encode("utf-8")
        req = urllib.request.Request(
            f"{BASE}/api/events/",
            data=payload,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                criados += 1
                print(f"criado ({r.status}): {evento['title']}", flush=True)
        except urllib.error.HTTPError as exc:
            # Um evento recusado nao aborta o seed — resultado parcial e mais
            # util que nenhum, e o motivo fica no log.
            recusados += 1
            print(f"recusado ({exc.code}): {evento['title']} -> {exc.read()[:200]}", flush=True)

    # Mas TODOS recusados e falha, e precisa falhar alto. A versao anterior
    # deste Job terminava "Completed" com zero eventos criados enquanto a API
    # devolvia 500 em toda chamada — um seed que mente e pior que um seed que
    # quebra, porque o ambiente parece pronto e nao esta.
    if criados == 0:
        raise SystemExit(f"seed falhou: 0 de {len(eventos)} eventos criados")

    print(f"seed concluido: {criados} criado(s), {recusados} recusado(s)", flush=True)
  eventos.json: |
