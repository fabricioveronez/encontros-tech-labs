---
apiVersion: batch/v1
kind: Job
metadata:
  name: encontros-tech-seed-bd76a48
  namespace: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech-seed
    app.kubernetes.io/part-of: encontros-tech
spec:
  backoffLimit: 10
  # Jobs concluidos nao sao coletados sozinhos, e o nome carrega o SHA do
  # commit: sem TTL, cada deploy deixa mais um Job Complete no namespace e
  # o `kubectl get pods` vira ruido que compete com sinal de incidente.
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: encontros-tech-seed
        app.kubernetes.io/part-of: encontros-tech
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: python:3.12-slim
          command: ["python", "/seed/seed.py"]
          volumeMounts:
            - name: seed
              mountPath: /seed
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: seed
          configMap:
            name: encontros-tech-seed
